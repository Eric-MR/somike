name: Release

# Pushing a tag v<version> (e.g. v0.2.0-beta.2) builds and tests Somike,
# builds the setup program, smoke-tests it on fresh VMs and only then
# publishes a GitHub release. The tag must match the version in
# CMakeLists.txt; versions with a suffix (-beta.N, -rc.N) are published as
# pre-releases. See docs/building.md#releases.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ci

      - name: Check the tag against the CMake version
        id: version
        shell: pwsh
        run: |
          $header = Get-Content build/ci/generated/somike/version.h -Raw
          if ($header -notmatch '#define SOMIKE_VERSION_STRING "([^"]+)"') {
            throw 'SOMIKE_VERSION_STRING not found in version.h'
          }
          $version = $Matches[1]
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match the CMake version v$version"
          }
          $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Build the setup program
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Preset ci -OutputDir dist -DownloadWebView2

      - name: Package the debug symbols
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $pdbs = 'somike', 'somike-apoctl', 'somike_apo', 'somike-selftest' |
            ForEach-Object { "build/ci/bin/$_.pdb" }
          Compress-Archive -Path $pdbs -DestinationPath "dist/Somike-$env:VERSION-symbols.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          if-no-files-found: error
          path: |
            dist/Somike-Setup-*.exe
            dist/Somike-*-symbols.zip

  smoke:
    name: Smoke test
    needs: build
    uses: ./.github/workflows/smoke-test.yml
    with:
      artifact: release-files

  publish:
    name: Publish
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance attestation
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Somike-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $heading = '^## \[' + [regex]::Escape($env:VERSION) + '\][^\r\n]*\r?\n'
          $pattern = '(?ms)' + $heading + '(.*?)(?=^## \[|^\[[^\]]+\]: |\z)'
          if ($changelog -notmatch $pattern) {
            throw "CHANGELOG.md has no section for $env:VERSION"
          }
          $changes = $Matches[1].Trim()

          $notes = Get-Content .github/release-template.md -Raw
          $notes = $notes.Replace('{{VERSION}}', $env:VERSION).Replace('{{CHANGES}}', $changes)
          if ($env:PRERELEASE -eq 'true') {
            $notes = "> [!WARNING]`n> **Pre-release (beta), not finished.** Made for testing and " +
              "feedback; expect rough edges. Please report problems as " +
              "[issues](https://github.com/${{ github.repository }}/issues/new/choose).`n`n" + $notes
          }
          [IO.File]::WriteAllText("$PWD/dist/release-notes.md", $notes)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Somike-Setup-*.exe
            dist/Somike-*-symbols.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          kind=--latest
          if [ "$PRERELEASE" = "true" ]; then kind=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" dist/Somike-* dist/SHA256SUMS.txt \
            --title "Somike $VERSION" \
            --notes-file dist/release-notes.md \
            --verify-tag "$kind"
